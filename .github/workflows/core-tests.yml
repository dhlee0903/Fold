name: 접기 엔진 테스트

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 안드로이드 SDK 없이도 도는 순수 JVM 모듈만 검사한다.
      - name: 접기 엔진 테스트
        run: ./gradlew --no-daemon :origami-core:test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report
          path: origami-core/build/reports/tests/test
