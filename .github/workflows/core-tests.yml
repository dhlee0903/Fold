name: 테스트

# 브랜치 push와 PR 양쪽에 걸면 커밋 하나마다 CI가 두 번 돈다.
# PR이 열린 브랜치는 pull_request 쪽이 맡고, push는 main만 본다.
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 러너에 안드로이드 SDK가 깔려 있어도 순수 JVM 모듈만 검사한다.
      - name: 접기 엔진 테스트
        run: ./gradlew --no-daemon -PincludeApp=false :origami-core:test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report
          path: origami-core/build/reports/tests/test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 웹 접기 엔진 테스트
        run: node --test web/origami.test.js

      - name: 페이지가 소스와 맞는지 확인
        run: |
          node web/build.mjs
          git diff --exit-code web/index.html web/dist/artifact.html
