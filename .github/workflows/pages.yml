name: 웹 배포

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 접기 엔진 테스트
        run: node --test web/origami.test.js

      - name: 페이지 다시 만들기
        run: node web/build.mjs

      # 커밋된 결과물과 방금 만든 것이 다르면, 손으로 고친 것이 있다는 뜻이다.
      - name: 결과물이 소스와 맞는지 확인
        run: git diff --exit-code web/index.html web/dist/artifact.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
