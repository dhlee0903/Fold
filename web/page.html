<title>책상 위의 종이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500&display=swap">

<style>
  /* 나뭇결 책상 위에 흰색/회색 양면 종이 한 장. 화면이 접히는 자리가 곧 종이의 접히는 자리다. */
  :root {
    --desk-top: #7A5738;
    --desk-bottom: #4E3521;
    --desk-grain: rgba(38, 24, 12, 0.26);
    --desk-sheen: rgba(255, 233, 198, 0.16);
    --paper-front: #FAFAF7;
    --paper-back: #C2C7C9;
    --paper-edge: rgba(60, 48, 38, 0.35);
    --paper-shadow: rgba(28, 17, 8, 0.34);
    --crease: rgba(120, 105, 90, 0.35);
    --hint: rgba(255, 246, 234, 0.72);
    color-scheme: dark;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --desk-top: #402C1B;
      --desk-bottom: #241810;
      --desk-grain: rgba(12, 7, 3, 0.34);
      --desk-sheen: rgba(255, 220, 175, 0.08);
      --paper-front: #E9E9E4;
      --paper-back: #A3A8AA;
      --paper-edge: rgba(20, 14, 8, 0.45);
      --paper-shadow: rgba(0, 0, 0, 0.5);
      --crease: rgba(90, 80, 70, 0.45);
      --hint: rgba(255, 246, 234, 0.6);
    }
  }

  :root[data-theme="dark"] {
    --desk-top: #402C1B;
    --desk-bottom: #241810;
    --desk-grain: rgba(12, 7, 3, 0.34);
    --desk-sheen: rgba(255, 220, 175, 0.08);
    --paper-front: #E9E9E4;
    --paper-back: #A3A8AA;
    --paper-edge: rgba(20, 14, 8, 0.45);
    --paper-shadow: rgba(0, 0, 0, 0.5);
    --crease: rgba(90, 80, 70, 0.45);
    --hint: rgba(255, 246, 234, 0.6);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    overflow: hidden;
    font-family: "IBM Plex Sans KR", system-ui, -apple-system, sans-serif;
    /* 위에서 비스듬히 빛이 드는 나뭇결 책상 */
    background:
      radial-gradient(130% 100% at 28% 4%, var(--desk-sheen), transparent 62%),
      repeating-linear-gradient(93deg,
        var(--desk-grain) 0 1px, transparent 1px 12px,
        rgba(255, 255, 255, 0.018) 12px 13px, transparent 13px 31px),
      repeating-linear-gradient(93deg,
        rgba(0, 0, 0, 0.05) 0 43px, transparent 43px 96px),
      linear-gradient(168deg, var(--desk-top), var(--desk-bottom));
    background-attachment: fixed;
  }

  /* 책상 가장자리를 살짝 어둡게 해서 종이가 떠 보이게 한다 */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.35));
  }

  #paper {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
  }

  #paper:active { cursor: grabbing; }

  .hint {
    position: fixed;
    left: 50%;
    bottom: max(22px, env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    margin: 0;
    padding: 0 16px;
    color: var(--hint);
    font-size: 0.82rem;
    letter-spacing: 0.01em;
    text-align: center;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
    pointer-events: none;
    transition: opacity 900ms ease;
  }

  .hint[data-gone="true"] { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    .hint { transition-duration: 1ms; }
  }
</style>

<!-- BODY -->
<canvas id="paper" aria-label="책상 위의 종이"></canvas>
<p class="hint" id="hint"></p>
