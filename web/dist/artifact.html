<title>폴드 종이접기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">

<style>
  /* 색종이: 쪽빛 잉크에 다홍 앞면, 무명빛 뒷면. 중성색은 쪽빛 쪽으로 살짝 기울였다. */
  :root {
    --ground: #E3E8EB;
    --surface: #F3F6F7;
    --surface-sunk: #D7DEE3;
    --ink: #1B2833;
    --muted: #5C6D79;
    --line: #C2CDD5;
    --accent: #C0402A;
    --guide: #2F6FA8;
    --paper-front: #D2543A;
    --paper-back: #FBF7F0;
    --paper-edge: #6B5B4E;
    --paper-shadow: rgba(27, 40, 51, 0.16);
    --stage-glow: rgba(255, 255, 255, 0.75);
    --focus: #2F6FA8;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #12181D;
      --surface: #1B242B;
      --surface-sunk: #0D1216;
      --ink: #E6EDF2;
      --muted: #93A5B1;
      --line: #2C3944;
      --accent: #E4664B;
      --guide: #6BA8DC;
      --paper-front: #C8503A;
      --paper-back: #EDE6DA;
      --paper-edge: #0E1418;
      --paper-shadow: rgba(0, 0, 0, 0.5);
      --stage-glow: rgba(120, 150, 175, 0.14);
      --focus: #6BA8DC;
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --ground: #12181D;
    --surface: #1B242B;
    --surface-sunk: #0D1216;
    --ink: #E6EDF2;
    --muted: #93A5B1;
    --line: #2C3944;
    --accent: #E4664B;
    --guide: #6BA8DC;
    --paper-front: #C8503A;
    --paper-back: #EDE6DA;
    --paper-edge: #0E1418;
    --paper-shadow: rgba(0, 0, 0, 0.5);
    --stage-glow: rgba(120, 150, 175, 0.14);
    --focus: #6BA8DC;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .app {
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto minmax(280px, 1fr) auto;
    gap: 0;
  }

  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 14px;
    padding: 18px 20px 12px;
  }

  .masthead h1 {
    font-family: "Gowun Batang", "Apple SD Gothic Neo", serif;
    font-weight: 700;
    font-size: clamp(1.5rem, 1.2rem + 1.4vw, 2rem);
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }

  .tagline {
    margin: 0;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .posture {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    font-size: 0.78rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .posture::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
  }

  .posture[data-live="true"] { color: var(--ink); }
  .posture[data-live="true"]::before { background: var(--accent); }

  /* 작업대: 종이 아래에만 빛이 떨어지도록 가운데를 밝힌다. */
  .stage {
    position: relative;
    min-height: 0;
    background:
      radial-gradient(ellipse 70% 60% at 50% 45%, var(--stage-glow), transparent 70%),
      var(--surface-sunk);
    border-block: 1px solid var(--line);
    touch-action: none;
  }

  #paper {
    display: block;
    width: 100%;
    height: 100%;
  }

  .stage-note {
    position: absolute;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.78rem;
    pointer-events: none;
    opacity: 0;
    transition: opacity 160ms ease;
  }

  .stage-note[data-show="true"] { opacity: 1; }

  .rail {
    display: grid;
    gap: 16px;
    padding: 18px 20px 26px;
    align-content: start;
  }

  .eyebrow {
    margin: 0 0 2px;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .step h2 {
    margin: 0 0 4px;
    font-family: "Gowun Batang", serif;
    font-size: 1.25rem;
    font-weight: 700;
    text-wrap: balance;
  }

  .step p {
    margin: 0;
    color: var(--muted);
  }

  /* 각도기: 힌지가 얼마나 접혔는지, 어디서 한 단계가 넘어가는지 보여 준다. */
  .gauge {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface);
  }

  .gauge svg { flex: none; }
  .gauge-track { stroke: var(--line); }
  .gauge-fill { stroke: var(--accent); transition: stroke-dashoffset 90ms linear; }
  .gauge-commit { stroke: var(--guide); }
  .gauge-needle { stroke: var(--ink); transition: transform 90ms linear; transform-origin: 60px 52px; }

  .gauge-read {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 1.5rem;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }

  .gauge-label {
    font-size: 0.78rem;
    color: var(--muted);
  }

  .controls { display: grid; gap: 10px; }

  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
    height: 28px;
  }

  .row { display: flex; flex-wrap: wrap; gap: 8px; }

  button {
    font: inherit;
    font-weight: 500;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 14px;
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
  }

  button:hover:not(:disabled) { border-color: var(--muted); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: default; }

  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #FFF8F2;
    padding-inline: 20px;
  }

  button[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--surface);
  }

  .field {
    font-size: 0.8rem;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }

  .free-options[hidden] { display: none; }

  footer {
    padding: 0 20px 24px;
    color: var(--muted);
    font-size: 0.78rem;
  }

  footer a { color: inherit; }

  @media (min-width: 900px) {
    .app {
      grid-template-columns: minmax(0, 1fr) 380px;
      grid-template-rows: auto minmax(0, 1fr) auto;
      height: 100dvh;
    }

    .masthead { grid-column: 1; }
    .stage { grid-column: 1; grid-row: 2; border-inline-end: 1px solid var(--line); }
    footer { grid-column: 1; grid-row: 3; }
    .rail {
      grid-column: 2;
      grid-row: 1 / -1;
      border-inline-start: 1px solid var(--line);
      overflow-y: auto;
      align-content: start;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 1ms !important; }
  }
</style>
<div class="app">
  <header class="masthead">
    <h1>폴드 종이접기</h1>
    <p class="tagline">기기를 접으면 종이가 한 단계씩 접힙니다</p>
    <p class="posture" id="posture" aria-live="polite">자세 확인 중</p>
  </header>

  <main class="stage" id="stage">
    <canvas id="paper" aria-label="접히는 종이"></canvas>
    <p class="stage-note" id="stageNote"></p>
  </main>

  <aside class="rail">
    <section class="step">
      <p class="eyebrow" id="stepCount">1 / 3 단계</p>
      <h2 id="stepTitle">오른쪽 1/4 접기</h2>
      <p id="stepInstruction">오른쪽 끝을 안쪽으로 접어 올립니다</p>
    </section>

    <div class="gauge">
      <svg width="120" height="64" viewBox="0 0 120 64" aria-hidden="true">
        <path class="gauge-track" d="M12 52 A48 48 0 0 1 108 52" fill="none" stroke-width="6" stroke-linecap="round"></path>
        <path class="gauge-fill" id="gaugeFill" d="M12 52 A48 48 0 0 1 108 52" fill="none" stroke-width="6"
              stroke-linecap="round" stroke-dasharray="151" stroke-dashoffset="151"></path>
        <line class="gauge-commit" x1="60" y1="4" x2="60" y2="14" stroke-width="2" stroke-linecap="round"
              transform="rotate(-40 60 52)"></line>
        <line class="gauge-needle" id="gaugeNeedle" x1="60" y1="52" x2="60" y2="14" stroke-width="2.5"
              stroke-linecap="round"></line>
      </svg>
      <div>
        <p class="gauge-read" id="angleRead">180°</p>
        <p class="gauge-label" id="gaugeLabel">펼친 상태</p>
      </div>
    </div>

    <div class="controls">
      <label class="field" for="foldRange">
        <span>직접 접기</span>
        <span id="progressRead">0%</span>
      </label>
      <input type="range" id="foldRange" min="0" max="100" value="0" step="1" aria-label="접힘 정도">
      <div class="row">
        <button class="primary" id="foldOnce">한 번 접기</button>
        <button id="undo" disabled>되돌리기</button>
        <button id="restart">처음부터</button>
      </div>
    </div>

    <nav class="controls" aria-label="작품 선택">
      <p class="eyebrow">무엇을 접을까요</p>
      <div class="row" id="models"></div>
    </nav>

    <div class="controls free-options" id="freeOptions" hidden>
      <p class="eyebrow">자유 접기 설정</p>
      <div class="row">
        <button id="freeDirection" aria-pressed="false">골접기 · 앞으로</button>
        <button id="freeLayers" aria-pressed="false">전체 겹</button>
      </div>
    </div>
  </aside>

  <footer>
    접히는 기기(갤럭시 Z 폴드 등)의 크롬에서는 화면을 반쯤 접으면 자동으로 한 단계가 접힙니다.
    그 밖의 기기에서는 슬라이더나 <kbd>스페이스</kbd>로 접으세요.
  </footer>
</div>

<script type="module">
// 종이접기 엔진 (안드로이드 앱의 origami-core를 그대로 옮긴 것)
//
// 접힌 종이는 "면(다각형 + 겹 번호 + 앞뒤 여부)의 목록"이다.
// 한 단계를 접으면 주름선으로 각 면을 자르고, 움직이는 쪽을 반사시킨 뒤,
// 넘어간 겹들의 순서를 뒤집어 남은 뭉치 위(골접기) 또는 아래(산접기)에 쌓는다.

const EPS = 1e-9;
const AREA_EPS = 1e-7;
const CLIP_EPS = 1e-9;

const vec = (x, y) => ({ x, y });
const add = (a, b) => vec(a.x + b.x, a.y + b.y);
const sub = (a, b) => vec(a.x - b.x, a.y - b.y);
const mul = (a, s) => vec(a.x * s, a.y * s);
const dot = (a, b) => a.x * b.x + a.y * b.y;
const len = (a) => Math.hypot(a.x, a.y);

function normalize(a) {
  const l = len(a);
  if (l <= EPS) throw new Error('0 벡터는 정규화할 수 없습니다.');
  return vec(a.x / l, a.y / l);
}

/** [point]를 지나 [dir] 방향으로 뻗는 주름선. normal 쪽이 양(+)의 반평면이다. */
function line(point, dir) {
  const d = normalize(dir);
  return { point, dir: d, normal: vec(-d.y, d.x) };
}

const lineThrough = (a, b) => line(a, sub(b, a));
const horizontal = (y) => line(vec(0, y), vec(1, 0));
/** 오른쪽(x가 큰 쪽)이 양의 반평면이 되도록 아래를 향한다. */
const vertical = (x) => line(vec(x, 0), vec(0, -1));

const signedDistance = (l, p) => dot(sub(p, l.point), l.normal);
const reflect = (l, p) => sub(p, mul(l.normal, 2 * signedDistance(l, p)));

function polygonArea(poly) {
  if (!poly || poly.length < 3) return 0;
  let sum = 0;
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i];
    const b = poly[(i + 1) % poly.length];
    sum += a.x * b.y - b.x * a.y;
  }
  return Math.abs(sum) / 2;
}

const isRealFacet = (poly) => poly.length >= 3 && polygonArea(poly) > AREA_EPS;

/** 다각형을 주름선의 한쪽 반평면만 남기고 자른다(Sutherland–Hodgman). */
function clipHalfPlane(poly, l, keepPositive) {
  if (!poly || poly.length < 3) return null;
  const sign = keepPositive ? 1 : -1;
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const cur = poly[i];
    const next = poly[(i + 1) % poly.length];
    const dCur = signedDistance(l, cur) * sign;
    const dNext = signedDistance(l, next) * sign;
    if (dCur >= -CLIP_EPS) out.push(cur);
    if ((dCur > CLIP_EPS && dNext < -CLIP_EPS) || (dCur < -CLIP_EPS && dNext > CLIP_EPS)) {
      const t = dCur / (dCur - dNext);
      out.push(add(cur, mul(sub(next, cur), t)));
    }
  }
  return isRealFacet(out) ? out : null;
}

/** [양수 쪽, 음수 쪽] 두 조각. 선이 지나지 않으면 한쪽은 null. */
const splitPolygon = (poly, l) => [clipHalfPlane(poly, l, true), clipHalfPlane(poly, l, false)];

function boundsOf(points) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of points) {
    if (p.x < minX) minX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.x > maxX) maxX = p.x;
    if (p.y > maxY) maxY = p.y;
  }
  if (minX === Infinity) return { minX: 0, minY: 0, maxX: 0, maxY: 0, width: 0, height: 0, centerX: 0, centerY: 0 };
  return {
    minX, minY, maxX, maxY,
    width: maxX - minX,
    height: maxY - minY,
    centerX: (minX + maxX) / 2,
    centerY: (minY + maxY) / 2,
  };
}

/** 주름선이 상자 안을 지나는 구간. 안내선을 그릴 때 쓴다. */
function segmentInside(l, bounds) {
  let tMin = -Infinity;
  let tMax = Infinity;
  const clip = (origin, direction, low, high) => {
    if (Math.abs(direction) < EPS) return origin >= low && origin <= high;
    const t1 = (low - origin) / direction;
    const t2 = (high - origin) / direction;
    tMin = Math.max(tMin, Math.min(t1, t2));
    tMax = Math.min(tMax, Math.max(t1, t2));
    return tMin <= tMax;
  };
  if (!clip(l.point.x, l.dir.x, bounds.minX, bounds.maxX)) return null;
  if (!clip(l.point.y, l.dir.y, bounds.minY, bounds.maxY)) return null;
  if (tMin > tMax) return null;
  return [add(l.point, mul(l.dir, tMin)), add(l.point, mul(l.dir, tMax))];
}

const VALLEY = 'valley';
const MOUNTAIN = 'mountain';
const POSITIVE = 'positive';
const NEGATIVE = 'negative';

const ALL_LAYERS = { kind: 'all' };
const topLayers = (count) => ({ kind: 'top', count });
const bottomLayers = (count) => ({ kind: 'bottom', count });

/** width x height 직사각형 종이 한 장. 원점이 가운데다. */
function sheet(width, height) {
  const hw = width / 2;
  const hh = height / 2;
  return [{
    polygon: [vec(-hw, -hh), vec(hw, -hh), vec(hw, hh), vec(-hw, hh)],
    layer: 0,
    flipped: false,
  }];
}

const modelBounds = (facets) => boundsOf(facets.flatMap((f) => f.polygon));
const layerCount = (facets) => new Set(facets.map((f) => f.layer)).size;
const totalArea = (facets) => facets.reduce((sum, f) => sum + polygonArea(f.polygon), 0);

/** 층 번호를 0부터 촘촘하게 다시 매긴다. */
function normalized(facets) {
  const order = [...new Set(facets.map((f) => f.layer))].sort((a, b) => a - b);
  const remap = new Map(order.map((layer, i) => [layer, i]));
  return facets.map((f) => ({ ...f, layer: remap.get(f.layer) }));
}

/**
 * 이 단계에서 움직이는 면들을 고른다.
 *
 * 겹 선택은 종이 전체가 아니라 "주름선 너머에 걸쳐 있는 면들" 중에서 센다.
 * 설명서의 "앞장만 접으세요"와 같은 뜻이다.
 */
function selectMoving(facets, step) {
  const touching = [];
  facets.forEach((facet, index) => {
    const [positive, negative] = splitPolygon(facet.polygon, step.crease);
    const movingPart = step.movingSide === POSITIVE ? positive : negative;
    const stayingPart = step.movingSide === POSITIVE ? negative : positive;
    if (movingPart) touching.push({ index, facet, movingPart, stayingPart });
  });
  touching.sort((a, b) => b.facet.layer - a.facet.layer);
  const layers = step.layers ?? ALL_LAYERS;
  let chosen = touching;
  if (layers.kind === 'top') chosen = touching.slice(0, layers.count);
  else if (layers.kind === 'bottom') chosen = touching.slice(Math.max(0, touching.length - layers.count));
  return new Map(chosen.map((s) => [s.index, s]));
}

/** 이 단계가 종이를 실제로 접는지(주름선이 종이를 지나는지). */
const affects = (facets, step) => selectMoving(facets, step).size > 0;

/** 단계를 적용해 완전히 접은(180°) 결과를 만든다. */
function applyFold(facets, step) {
  const moving = selectMoving(facets, step);
  if (moving.size === 0) return facets;

  const result = [];
  const top = Math.max(...facets.map((f) => f.layer));
  const bottom = Math.min(...facets.map((f) => f.layer));

  facets.forEach((facet, index) => {
    const split = moving.get(index);
    if (!split) result.push(facet);
    else if (split.stayingPart) result.push({ ...facet, polygon: split.stayingPart });
  });

  for (const split of [...moving.values()].sort((a, b) => a.index - b.index)) {
    const old = split.facet.layer;
    // 반사되면서 겹 순서도 뒤집힌다: 맨 위에 있던 겹이 넘어간 뭉치의 맨 아래가 된다.
    const layer = step.direction === MOUNTAIN ? 2 * bottom - 1 - old : 2 * top + 1 - old;
    result.push({
      polygon: split.movingPart.map((p) => reflect(step.crease, p)),
      layer,
      flipped: !split.facet.flipped,
    });
  }
  return normalized(result);
}

/**
 * 접는 중간 자세. progress 0=펴짐, 1=완전히 접힘.
 *
 * 움직이는 조각은 주름선을 축으로 회전한다. 정사영으로 그리므로 주름선에서의
 * 거리 d는 d·cos(θ)로 줄고 d·sin(θ)만큼 떠오른다. θ=180°면 applyFold와 같아진다.
 */
function pose(facets, step, progress) {
  const posed = [];
  if (!step || progress <= 0) {
    for (const f of facets) {
      posed.push({ polygon: f.polygon, flipped: f.flipped, moving: false, lift: 0, drawKey: f.layer });
    }
    return posed.sort((a, b) => a.drawKey - b.drawKey);
  }

  const t = Math.min(1, Math.max(0, progress));
  const theta = Math.PI * t;
  const cosT = Math.cos(theta);
  const sinT = Math.sin(theta);
  const liftSign = step.direction === MOUNTAIN ? -1 : 1;
  const movingBias = liftSign * 1e6;
  const moving = selectMoving(facets, step);

  facets.forEach((facet, index) => {
    const split = moving.get(index);
    if (!split) {
      posed.push({ polygon: facet.polygon, flipped: facet.flipped, moving: false, lift: 0, drawKey: facet.layer });
      return;
    }
    if (split.stayingPart) {
      posed.push({ polygon: split.stayingPart, flipped: facet.flipped, moving: false, lift: 0, drawKey: facet.layer });
    }
    let distanceSum = 0;
    const rotated = split.movingPart.map((p) => {
      const d = signedDistance(step.crease, p);
      distanceSum += Math.abs(d);
      return sub(p, mul(step.crease.normal, d * (1 - cosT)));
    });
    // 90도를 넘어가면 뭉치가 뒤집히므로 겹 순서도 함께 뒤집힌다.
    const order = t < 0.5 ? facet.layer : -facet.layer;
    posed.push({
      polygon: rotated,
      flipped: t > 0.5 ? !facet.flipped : facet.flipped,
      moving: true,
      lift: liftSign * sinT * (distanceSum / split.movingPart.length),
      drawKey: movingBias + order,
    });
  });
  return posed.sort((a, b) => a.drawKey - b.drawKey);
}

/** 이보다 짧게 쓸면 주름선이 흔들려 무시한다(종이 좌표 기준). */
const MIN_DRAG = 0.08;

/**
 * "이 점을 저 점 위로 접기"를 한 단계로 만든다.
 * 두 점을 포갤 수 있는 주름선은 수직이등분선 하나뿐이다.
 */
function pointToPointFold(from, to, { direction = VALLEY, layers = ALL_LAYERS } = {}) {
  const delta = sub(to, from);
  if (len(delta) < MIN_DRAG) return null;
  const crease = line(mul(add(from, to), 0.5), vec(-delta.y, delta.x));
  return {
    title: '자유 접기',
    instruction: '짚은 점을 도착한 점 위로 포갭니다',
    crease,
    // 손가락을 올린 쪽(=from)이 넘어간다.
    movingSide: signedDistance(crease, from) > 0 ? POSITIVE : NEGATIVE,
    direction,
    layers,
  };
}

const modelById = (id) => MODELS.find((m) => m.id === id) ?? MODELS[0];

/** 한 단계를 확정하는 접힘 정도(약 50°). 폴드류는 다 닫히기 전에 화면이 꺼진다. */
const COMMIT_THRESHOLD = 0.72;
/** 다시 이만큼 펴야 다음 단계를 접을 수 있다(약 145°). */
const RELEASE_THRESHOLD = 0.2;

/** 힌지 각도(180=펴짐, 0=닫힘)를 접힘 정도로. */
const progressFromHingeAngle = (degrees) => Math.min(1, Math.max(0, (180 - degrees) / 180));

/**
 * 한 번 접었다 펴는 동작이 한 단계에 대응하는 상태 기계.
 */
class FoldSession {
  constructor(model) {
    this.reset(model);
  }

  reset(model) {
    this.model = model;
    this.freeform = !!model.freeform;
    this.steps = [...model.steps];
    this.paper = model.sheet();
    this.history = [];
    this.stepIndex = 0;
    this.progress = 0;
    this.armed = true;
  }

  get currentStep() {
    return this.steps[this.stepIndex] ?? null;
  }

  /** 자유 모드는 끝이 없으므로 완성 상태가 되지 않는다. */
  get isComplete() {
    return !this.freeform && this.steps.length > 0 && this.stepIndex >= this.steps.length;
  }

  get canUndo() {
    return this.history.length > 0;
  }

  /** @returns 'committed' | 'completed' | 'armed' | null */
  update(foldProgress) {
    this.progress = Math.min(1, Math.max(0, foldProgress));
    const step = this.currentStep;
    if (!step) return null;

    if (this.armed && this.progress >= COMMIT_THRESHOLD) {
      this.history.push({ paper: this.paper, stepIndex: this.stepIndex });
      this.paper = applyFold(this.paper, step);
      this.stepIndex++;
      this.armed = false;
      return this.isComplete ? 'completed' : 'committed';
    }
    if (!this.armed && this.progress <= RELEASE_THRESHOLD) {
      this.armed = true;
      return 'armed';
    }
    return null;
  }

  /** 자유 모드에서 사용자가 그은 주름선을 다음 단계로 넣는다. */
  queueStep(step) {
    this.steps.length = this.stepIndex;
    this.steps.push(step);
  }

  undo() {
    const previous = this.history.pop();
    if (!previous) return false;
    this.paper = previous.paper;
    this.stepIndex = previous.stepIndex;
    this.armed = this.progress <= RELEASE_THRESHOLD;
    return true;
  }

  pose() {
    return pose(this.paper, this.currentStep, this.armed ? this.progress : 0);
  }
}

// 화면: 종이 그리기, 기기 자세 감지, 조작부.


const el = (id) => document.getElementById(id);
const dom = {
  posture: el('posture'), stage: el('stage'), canvas: el('paper'), note: el('stageNote'),
  stepCount: el('stepCount'), stepTitle: el('stepTitle'), stepInstruction: el('stepInstruction'),
  gaugeFill: el('gaugeFill'), gaugeNeedle: el('gaugeNeedle'), angleRead: el('angleRead'), gaugeLabel: el('gaugeLabel'),
  foldRange: el('foldRange'), progressRead: el('progressRead'), foldOnce: el('foldOnce'),
  undo: el('undo'), restart: el('restart'), models: el('models'),
  freeOptions: el('freeOptions'), freeDirection: el('freeDirection'), freeLayers: el('freeLayers'),
};

const ARC_LENGTH = 151;
const context = dom.canvas.getContext('2d');

let model = MODELS[0];
let session = new FoldSession(model);
let viewBounds = boundsFor(session);
let progress = 0;
let target = 0;
let animating = false;
let freeDirection = VALLEY;
let freeTopOnly = false;
let drag = null;

/** 그림이 잘리지 않도록 원래 종이와 접힌 종이를 모두 담는 상자. 접는 도중엔 바뀌지 않는다. */
function boundsFor(current) {
  const flat = modelBounds(current.model.sheet());
  const folded = modelBounds(current.paper);
  const margin = 0.08 * Math.max(flat.width, flat.height);
  return boundsOf([
    vec(Math.min(flat.minX, folded.minX) - margin, Math.min(flat.minY, folded.minY) - margin),
    vec(Math.max(flat.maxX, folded.maxX) + margin, Math.max(flat.maxY, folded.maxY) + margin),
  ]);
}

// --- 색: CSS 변수에서 읽어 와 라이트/다크를 함께 따라간다 ---
let palette = readPalette();

function readPalette() {
  const style = getComputedStyle(document.documentElement);
  const read = (name) => style.getPropertyValue(name).trim();
  return {
    front: read('--paper-front'),
    back: read('--paper-back'),
    edge: read('--paper-edge'),
    guide: read('--guide'),
    shadow: read('--paper-shadow'),
  };
}

function refreshPalette() {
  palette = readPalette();
  draw();
}

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', refreshPalette);
new MutationObserver(refreshPalette).observe(document.documentElement, { attributeFilter: ['data-theme'] });

// --- 좌표 변환 ---
let view = { scale: 1, offsetX: 0, offsetY: 0 };

function fitView() {
  const rect = dom.canvas.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;
  dom.canvas.width = Math.max(1, Math.round(rect.width * ratio));
  dom.canvas.height = Math.max(1, Math.round(rect.height * ratio));
  const scale = Math.min(
    rect.width / Math.max(viewBounds.width, 1e-3),
    rect.height / Math.max(viewBounds.height, 1e-3),
  ) * 0.9;
  view = {
    scale,
    offsetX: rect.width / 2 - viewBounds.centerX * scale,
    offsetY: rect.height / 2 + viewBounds.centerY * scale,
    ratio,
  };
}

const toScreen = (p) => ({ x: view.offsetX + p.x * view.scale, y: view.offsetY - p.y * view.scale });
const toPaper = (x, y) => vec((x - view.offsetX) / view.scale, (view.offsetY - y) / view.scale);

// --- 그리기 ---
function tracePath(polygon) {
  context.beginPath();
  polygon.forEach((point, i) => {
    const s = toScreen(point);
    if (i === 0) context.moveTo(s.x, s.y);
    else context.lineTo(s.x, s.y);
  });
  context.closePath();
}

function draw() {
  const rect = dom.canvas.getBoundingClientRect();
  context.setTransform(view.ratio || 1, 0, 0, view.ratio || 1, 0, 0);
  context.clearRect(0, 0, rect.width, rect.height);
  context.lineJoin = 'round';

  for (const facet of session.pose()) {
    // 들린 종이는 아래에 그림자를 만든다.
    if (Math.abs(facet.lift) > 1e-3) {
      const drop = Math.max(-24, Math.min(24, facet.lift * 14));
      context.save();
      context.translate(drop, drop);
      tracePath(facet.polygon);
      context.fillStyle = palette.shadow;
      context.fill();
      context.restore();
    }
    tracePath(facet.polygon);
    context.fillStyle = facet.flipped ? palette.back : palette.front;
    context.fill();
    // 들린 만큼 밝기를 조금 바꿔 입체감을 준다.
    const shade = Math.max(-0.3, Math.min(0.3, facet.lift * 0.35));
    if (Math.abs(shade) > 0.01) {
      context.fillStyle = shade > 0 ? `rgba(255,255,255,${shade})` : `rgba(0,0,0,${-shade})`;
      context.fill();
    }
    context.strokeStyle = palette.edge;
    context.globalAlpha = 0.45;
    context.lineWidth = 1;
    context.stroke();
    context.globalAlpha = 1;
  }

  const step = session.currentStep;
  if (step) {
    const segment = segmentInside(step.crease, viewBounds);
    if (segment) {
      const [a, b] = segment.map(toScreen);
      context.save();
      context.setLineDash([8, 7]);
      context.strokeStyle = palette.guide;
      context.globalAlpha = 0.75;
      context.lineWidth = 1.5;
      context.beginPath();
      context.moveTo(a.x, a.y);
      context.lineTo(b.x, b.y);
      context.stroke();
      context.restore();
    }
  }

  if (drag) {
    const a = toScreen(drag.from);
    const b = toScreen(drag.to);
    context.save();
    context.setLineDash([6, 6]);
    context.strokeStyle = palette.guide;
    context.lineWidth = 2;
    context.beginPath();
    context.moveTo(a.x, a.y);
    context.lineTo(b.x, b.y);
    context.stroke();
    context.setLineDash([]);
    context.beginPath();
    context.arc(a.x, a.y, 6, 0, Math.PI * 2);
    context.fill();
    context.beginPath();
    context.arc(b.x, b.y, 9, 0, Math.PI * 2);
    context.globalAlpha = 0.35;
    context.fill();
    context.restore();
  }
}

// --- 화면 글자 갱신 ---
function syncUi() {
  const step = session.currentStep;
  const total = model.freeform ? session.steps.length : model.steps.length;

  if (session.isComplete) {
    dom.stepCount.textContent = '완성';
    dom.stepTitle.textContent = '다 접었습니다';
    dom.stepInstruction.textContent = `종이가 ${new Set(session.paper.map((f) => f.layer)).size}겹이 됐어요. 다른 작품도 접어 보세요.`;
  } else if (!step && model.freeform) {
    dom.stepCount.textContent = '자유 접기';
    dom.stepTitle.textContent = '종이를 쓸어 주름선을 그으세요';
    dom.stepInstruction.textContent = '접을 점에서 도착할 점으로 끌면 두 점을 포개는 선이 생깁니다.';
  } else if (!step) {
    dom.stepCount.textContent = '';
    dom.stepTitle.textContent = '작품을 고르세요';
    dom.stepInstruction.textContent = '';
  } else {
    dom.stepCount.textContent = model.freeform ? '자유 접기' : `${session.stepIndex + 1} / ${total} 단계`;
    dom.stepTitle.textContent = step.title;
    dom.stepInstruction.textContent = session.armed ? step.instruction : '기기를 다시 펴면 다음 단계로 넘어갑니다.';
  }

  const angle = 180 - progress * 180;
  dom.angleRead.textContent = `${Math.round(angle)}°`;
  dom.gaugeFill.setAttribute('stroke-dashoffset', String(ARC_LENGTH * (1 - progress)));
  dom.gaugeNeedle.setAttribute('transform', `rotate(${(90 - progress * 180).toFixed(1)} 60 52)`);
  dom.gaugeLabel.textContent = progress >= COMMIT_THRESHOLD
    ? (session.armed ? '접는 중' : '한 단계 접었습니다')
    : progress <= RELEASE_THRESHOLD ? '펼친 상태' : '접는 중';
  dom.progressRead.textContent = `${Math.round(progress * 100)}%`;
  dom.foldRange.value = String(Math.round(progress * 100));
  dom.undo.disabled = !session.canUndo;
  dom.freeOptions.hidden = !model.freeform;

  const note = model.freeform && !session.currentStep
    ? '종이를 쓸어 주름선을 그으세요'
    : (!session.armed ? '펴면 다음 단계' : '');
  dom.note.textContent = note;
  dom.note.dataset.show = note ? 'true' : 'false';
}

// --- 진행 상태 ---
function setProgress(next) {
  progress = Math.min(1, Math.max(0, next));
  const event = session.update(progress);
  if (event === 'committed' || event === 'completed') {
    viewBounds = boundsFor(session);
    fitView();
    navigator.vibrate?.(12);
  }
  draw();
  syncUi();
}

function animateTo(value) {
  target = value;
  if (animating) return;
  animating = true;
  let last = performance.now();
  const tick = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const speed = 1.8; // 초당 진행률
    const delta = target - progress;
    const stepSize = Math.sign(delta) * Math.min(Math.abs(delta), speed * dt);
    setProgress(progress + stepSize);
    if (Math.abs(target - progress) < 0.001) {
      setProgress(target);
      animating = false;
      return;
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

/** 한 번 접었다 펴는 동작 = 한 단계. */
function foldOnce() {
  animateTo(1);
  const waitForFold = setInterval(() => {
    if (progress >= 0.999) {
      clearInterval(waitForFold);
      animateTo(0);
    }
  }, 40);
}

// --- 기기 자세 감지 ---
function watchPosture() {
  if (!('devicePosture' in navigator)) {
    dom.posture.textContent = '이 브라우저에서는 접힘을 읽을 수 없어요 · 아래로 접으세요';
    return;
  }
  const apply = () => {
    const folded = navigator.devicePosture.type === 'folded';
    dom.posture.dataset.live = 'true';
    dom.posture.textContent = folded ? '기기 접힘 감지' : '기기 펼침 · 반쯤 접어 보세요';
    animateTo(folded ? 1 : 0);
  };
  navigator.devicePosture.addEventListener('change', apply);
  apply();
}

// --- 조작 ---
function selectModel(next) {
  model = next;
  session = new FoldSession(next);
  progress = 0;
  target = 0;
  drag = null;
  viewBounds = boundsFor(session);
  fitView();
  draw();
  syncUi();
  for (const button of dom.models.children) {
    button.setAttribute('aria-pressed', String(button.dataset.id === next.id));
  }
}

for (const entry of MODELS) {
  const button = document.createElement('button');
  button.textContent = entry.name;
  button.dataset.id = entry.id;
  button.setAttribute('aria-pressed', String(entry.id === model.id));
  button.addEventListener('click', () => selectModel(modelById(entry.id)));
  dom.models.append(button);
}

dom.foldRange.addEventListener('input', () => {
  animating = false;
  setProgress(Number(dom.foldRange.value) / 100);
});

dom.foldOnce.addEventListener('click', foldOnce);

dom.undo.addEventListener('click', () => {
  session.undo();
  viewBounds = boundsFor(session);
  fitView();
  draw();
  syncUi();
});

dom.restart.addEventListener('click', () => selectModel(model));

dom.freeDirection.addEventListener('click', () => {
  freeDirection = freeDirection === VALLEY ? MOUNTAIN : VALLEY;
  const valley = freeDirection === VALLEY;
  dom.freeDirection.textContent = valley ? '골접기 · 앞으로' : '산접기 · 뒤로';
  dom.freeDirection.setAttribute('aria-pressed', String(!valley));
});

dom.freeLayers.addEventListener('click', () => {
  freeTopOnly = !freeTopOnly;
  dom.freeLayers.textContent = freeTopOnly ? '앞장만' : '전체 겹';
  dom.freeLayers.setAttribute('aria-pressed', String(freeTopOnly));
});

document.addEventListener('keydown', (event) => {
  if (event.code !== 'Space' || event.target !== document.body) return;
  event.preventDefault();
  foldOnce();
});

// 자유 접기: 종이 위를 쓸면 짚은 점을 도착한 점 위로 포개는 주름선이 생긴다.
dom.canvas.addEventListener('pointerdown', (event) => {
  if (!model.freeform) return;
  const rect = dom.canvas.getBoundingClientRect();
  const point = toPaper(event.clientX - rect.left, event.clientY - rect.top);
  drag = { from: point, to: point };
  dom.canvas.setPointerCapture(event.pointerId);
});

dom.canvas.addEventListener('pointermove', (event) => {
  if (!drag) return;
  const rect = dom.canvas.getBoundingClientRect();
  drag.to = toPaper(event.clientX - rect.left, event.clientY - rect.top);
  draw();
});

dom.canvas.addEventListener('pointerup', () => {
  if (!drag) return;
  const step = pointToPointFold(drag.from, drag.to, {
    direction: freeDirection,
    layers: freeTopOnly ? topLayers(1) : ALL_LAYERS,
  });
  drag = null;
  if (step) session.queueStep(step);
  draw();
  syncUi();
});

dom.canvas.addEventListener('pointercancel', () => {
  drag = null;
  draw();
});

const resize = new ResizeObserver(() => {
  fitView();
  draw();
});
resize.observe(dom.stage);

fitView();
draw();
syncUi();
watchPosture();
</script>
